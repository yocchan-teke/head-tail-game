<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>頭お尻ゲーム</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#fff;background:#101b35}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(155deg,#142750,#0c1227);padding:24px 16px}.app{max-width:520px;margin:auto;text-align:center}h1{font-size:2rem;margin:16px 0 6px}.sub{color:#bed0ec;margin:0 0 24px}.panel{background:#1e335b;border:1px solid #45628c;border-radius:22px;padding:22px 16px;margin:16px 0}.letters{display:flex;align-items:center;justify-content:center;gap:22px}.letter{font-size:4.5rem;font-weight:900;color:#ffe477}.arrow{font-size:2rem;color:#a8c7ff}.hint{font-size:.9rem;color:#bfd0eb}.timer{font-size:3.5rem;font-weight:900;font-variant-numeric:tabular-nums;margin:6px}.bar{height:10px;background:#526684;border-radius:10px;overflow:hidden}.fill{height:100%;width:100%;background:#54dbad;transition:width .08s linear}input{display:block;width:100%;font-size:1.25rem;padding:15px;border-radius:12px;border:2px solid #6989ba;background:#f8fbff;color:#13203b;margin:16px 0}button{border:0;border-radius:12px;padding:14px 18px;font-size:1rem;font-weight:700;cursor:pointer}button:disabled{opacity:.45}.primary{background:#ffd65a;color:#1d2944}.secondary{background:#385b90;color:#fff}.danger{background:#7b3446;color:#fff}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.status{min-height:58px;line-height:1.6;font-weight:650}.score{font-size:1.1rem}.note{font-size:.82rem;color:#bacbe6;line-height:1.7;text-align:left}.toggle{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px}.toggle input{width:auto;margin:0}footer{font-size:.75rem;color:#a9bad7;margin-top:22px}
</style>
</head>
<body><main class="app">
<h1>🎤 頭お尻ゲーム</h1><p class="sub">10秒で、できるだけ長い言葉を作ろう！</p>
<section class="panel"><div class="hint">頭　　　　　　　　　お尻</div><div class="letters"><span id="head" class="letter">？</span><span class="arrow">→</span><span id="tail" class="letter">？</span></div><div class="hint">この2文字で始まり、終わる言葉</div></section>
<section class="panel"><div class="hint">残り時間</div><div id="timer" class="timer">10.0</div><div class="bar"><div id="fill" class="fill"></div></div></section>
<label for="answer">回答</label><input id="answer" type="text" placeholder="スタートして言葉を入力" autocomplete="off" autocapitalize="off" disabled maxlength="100">
<div class="actions"><button class="primary" id="start">スタート / 次のお題</button><button class="secondary" id="submit" disabled>回答する</button></div>
<label class="toggle"><input type="checkbox" id="music" checked> BGM・効果音を鳴らす</label>
<section class="panel"><div id="status" class="status" aria-live="polite">スタートを押してください</div><div class="score">今回 <strong id="score">0</strong> 点 ／ 最高 <strong id="best">0</strong> 点</div><div class="actions" style="margin-top:14px"><button id="invalidate" class="danger" disabled>この回答を無効にする</button></div></section>
<p class="note">採点ルール：最初と最後のひらがなが一致すれば、ひらがな換算の文字数が得点です。小さい「ゃ・ゅ・ょ・っ」も1文字として数えます。実在する単語かどうかは自動判定しません。入力途中でも10秒経過時点で自動採点します。最高得点はこの端末のブラウザに保存されます。</p>
<footer>非公式ファンメイド風のオリジナルゲームです。番組の音源は使用していません。</footer>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);const chars=[...'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわん'];
let head='',tail='',running=false,deadline=0,raf=0,audio=null,musicTimer=null,points=0,validRound=false;
let best=0;try{best=Number(localStorage.getItem('headTailBest')||0)}catch(e){}$('best').textContent=best;
function sound(freq,duration=.13,type='sine',volume=.06){if(!$('music').checked)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const osc=audio.createOscillator(),gain=audio.createGain();osc.type=type;osc.frequency.value=freq;gain.gain.setValueAtTime(volume,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);osc.connect(gain).connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration)}catch(e){}}
function stopMusic(){if(musicTimer!==null){clearInterval(musicTimer);musicTimer=null}}
function startMusic(){stopMusic();let n=0;const notes=[392,494,587,494,440,523,659,523];musicTimer=setInterval(()=>{if(running)sound(notes[n++%notes.length],.17,'triangle',.035)},220)}
function normalize(s){return s.normalize('NFKC').trim().replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-96)).replace(/\s+/g,'')}
function update(){if(!running)return;const left=Math.max(0,(deadline-performance.now())/1000);$('timer').textContent=left.toFixed(1);$('fill').style.width=(left*10)+'%';$('fill').style.background=left<=3?'#ff7373':'#54dbad';if(left<=0){finish(true);return}raf=requestAnimationFrame(update)}
function start(){if(running){running=false;cancelAnimationFrame(raf);stopMusic()}head=chars[Math.floor(Math.random()*chars.length)];do{tail=chars[Math.floor(Math.random()*chars.length)]}while(tail===head);$('head').textContent=head;$('tail').textContent=tail;$('answer').value='';$('answer').disabled=false;$('submit').disabled=false;$('invalidate').disabled=true;$('score').textContent='0';points=0;validRound=false;$('status').textContent='10秒以内に回答！';$('timer').textContent='10.0';$('fill').style.width='100%';running=true;deadline=performance.now()+10000;sound(784,.18);startMusic();raf=requestAnimationFrame(update);$('answer').focus()}
function finish(timeout=false){if(!running)return;running=false;cancelAnimationFrame(raf);stopMusic();$('answer').disabled=true;$('submit').disabled=true;$('timer').textContent=timeout?'0.0':Math.max(0,(deadline-performance.now())/1000).toFixed(1);$('fill').style.width=timeout?'0%':$('fill').style.width;const a=normalize($('answer').value);const letters=[...a];const ok=letters.length>=2&&letters[0]===head&&letters.at(-1)===tail&&/^[ぁ-ゖー]+$/.test(a);points=ok?letters.length:0;validRound=ok;$('score').textContent=points;$('invalidate').disabled=!ok;if(ok){$('status').textContent=`${timeout?'時間切れ！':'回答！'} 「${a}」で ${points} 点！ 実在する言葉か確認してください。`;if(points>best){best=points;$('best').textContent=best;try{localStorage.setItem('headTailBest',String(best))}catch(e){}}sound(880,.2);setTimeout(()=>sound(1175,.25),130)}else{$('status').textContent=timeout&&!a?'時間切れ！回答なし（0点）':'頭とお尻が一致しない、またはひらがな以外が含まれています（0点）';sound(220,.35,'sawtooth',.04)}}
$('start').addEventListener('click',start);$('submit').addEventListener('click',()=>finish(false));$('answer').addEventListener('keydown',e=>{if(e.key==='Enter'&&running){e.preventDefault();finish(false)}});$('invalidate').addEventListener('click',()=>{if(!validRound)return;validRound=false;points=0;$('score').textContent='0';$('status').textContent='この回答を無効にしました（0点）。※最高得点は過去の記録として残ります。';$('invalidate').disabled=true});$('music').addEventListener('change',()=>{if(!$('music').checked)stopMusic();else if(running)startMusic()});document.addEventListener('visibilitychange',()=>{if(document.hidden)stopMusic();else if(running)startMusic()});
})();
</script></body></html>
